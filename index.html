<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root{
  --blue:#4A90E2; --mint:#7FC4A5; --signal:#F2E63C;
  --loss:#2E9E5B; --gain:#D9483F;
  --r:10px;
  --nav-w:238px; --nav-rail:64px;
  --f-disp:"Archivo",system-ui,-apple-system,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface-2:#FAFAF8;
  --ink:#23241F; --ink-2:#4B4D46; --muted:#7A7C73;
  --line:#E4E4DF; --line-2:#EFEFEA;
  --band:#2F312B; --band-ink:#FFFFFF;
  --mon:#FEFBD6; --mon-line:#E8D93B;
  --wknd:#F0F0EC; --now:#E8F0FB;
  --shadow:0 1px 2px rgba(35,36,31,.06), 0 8px 24px rgba(35,36,31,.05);
}
html[data-theme="dark"]{
  --bg:#171814; --surface:#22231F; --surface-2:#1D1E1A;
  --ink:#F1F1EC; --ink-2:#C9CAC2; --muted:#8E9088;
  --line:#33352F; --line-2:#2A2C26;
  --band:#0F100D; --band-ink:#F1F1EC;
  --mon:#33301A; --mon-line:#8C8324;
  --wknd:#1C1D19; --now:#1D2833;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:13.5px; letter-spacing:-0.02em}

/* ============================================================
   SHELL
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  height:58px; padding:0 16px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.iconbtn{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:38px; flex:0 0 auto;
  background:transparent; border:1px solid var(--line);
  border-radius:9px; color:var(--ink-2); cursor:pointer;
}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brand{font-family:var(--f-disp); font-weight:700; font-size:14px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink)}
.here{font-family:var(--f-disp); font-weight:500; font-size:13px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.here:before{content:"/"; margin-right:10px; color:var(--line)}
.topbar .spacer{flex:1}
.today-chip{
  font-family:var(--f-body); font-size:13px; color:var(--muted); white-space:nowrap;
}
.today-chip b{color:var(--ink); font-weight:600; margin-left:6px}

.layout{display:flex; align-items:flex-start; min-height:calc(100vh - 58px)}

nav.side{
  position:sticky; top:58px; flex:0 0 var(--nav-w); width:var(--nav-w);
  height:calc(100vh - 58px); overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--line);
  padding:14px 10px; overflow-x:hidden; transition:flex-basis .18s ease, width .18s ease;
}
body.nav-collapsed nav.side{flex-basis:var(--nav-rail); width:var(--nav-rail)}
body.nav-collapsed nav.side .nav-label,
body.nav-collapsed nav.side .nav-group{opacity:0; pointer-events:none}
.nav-group{
  font-family:var(--f-disp); font-weight:600; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted);
  padding:16px 12px 7px; transition:opacity .12s;
}
.nav-group:first-child{padding-top:4px}
a.navitem{
  display:flex; align-items:center; gap:13px;
  padding:11px 12px; margin-bottom:2px;
  border-radius:9px; text-decoration:none; color:var(--ink-2);
  font-size:14px; font-weight:500; white-space:nowrap;
}
a.navitem svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a.navitem:hover{background:var(--surface-2); color:var(--ink)}
a.navitem[aria-current="page"]{background:var(--band); color:var(--band-ink)}
.nav-label{transition:opacity .12s}

main{flex:1; min-width:0; padding:26px 22px 90px; max-width:1120px; margin:0 auto}
.page{display:none}
.page.on{display:block; animation:in .22s ease both}
@keyframes in{from{opacity:0; transform:translateY(5px)}to{opacity:1;transform:none}}

h1.title{
  font-family:var(--f-disp); font-weight:600; font-size:22px;
  letter-spacing:-0.015em; margin:0 0 22px; color:var(--ink-2);
}
h2.sect{
  font-family:var(--f-disp); font-weight:600; font-size:11px;
  letter-spacing:.15em; text-transform:uppercase; color:var(--muted);
  margin:34px 0 12px;
}
h2.sect:first-of-type{margin-top:0}

/* ============================================================
   SIGNATURE: THE FINISH LINE TRACK
   ============================================================ */
.track-card{
  background:var(--band); color:var(--band-ink);
  border-radius:var(--r); padding:26px 24px 20px; box-shadow:var(--shadow);
}
.track-ends{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px}
.track-ends span{font-family:var(--f-disp); font-weight:600; font-size:10px; letter-spacing:.15em; text-transform:uppercase; opacity:.6}
.track-ends b{display:block; font-family:var(--f-disp); font-weight:700; font-size:28px; font-stretch:112%; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; opacity:1; margin-top:4px}
.track-ends .r{text-align:right}
.track{
  position:relative; height:16px; border-radius:99px;
  background:rgba(255,255,255,.13); margin:0 0 8px;
}
.track .fill{position:absolute; inset:0 auto 0 0; border-radius:99px; background:linear-gradient(90deg,var(--blue),var(--mint)); transition:width .5s ease}
.track .pace{position:absolute; top:-9px; bottom:-9px; width:2px; background:rgba(255,255,255,.55)}
.track .you{
  position:absolute; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px;
  border-radius:99px; background:var(--signal); border:3px solid var(--band);
  box-shadow:0 0 0 2px rgba(242,230,60,.35);
}
.track-legend{display:flex; gap:20px; flex-wrap:wrap; padding-top:12px; border-top:1px solid rgba(255,255,255,.12); margin-top:14px}
.track-legend div{font-family:var(--f-disp); font-weight:600; font-size:10px; letter-spacing:.14em; text-transform:uppercase; opacity:.6}
.track-legend b{display:block; font-family:var(--f-disp); font-weight:700; font-size:20px; font-stretch:112%; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; opacity:1; margin-top:3px}
.dot{display:inline-block; width:9px; height:9px; border-radius:99px; margin-right:7px; vertical-align:1px}

/* ============================================================
   METRIC ROWS (single column, full width)
   ============================================================ */
.rows{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.row{
  display:flex; align-items:center; gap:16px;
  padding:15px 20px; border-bottom:1px solid var(--line-2);
}
.row:last-child{border-bottom:0}
.row .k{
  flex:1; min-width:0;
  font-family:var(--f-disp); font-weight:600; font-size:11.5px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
}
.row .k small{display:block; font-family:var(--f-body); font-size:12px; letter-spacing:0; text-transform:none; color:var(--muted); opacity:.85; margin-top:3px; font-weight:400}
.row .v{
  font-family:var(--f-disp); font-weight:700; font-size:26px; font-stretch:112%;
  letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
  color:var(--ink); white-space:nowrap;
}
.row .v u{text-decoration:none; font-size:13px; font-weight:500; font-stretch:100%; color:var(--muted); margin-left:5px}
.row.hi{background:var(--surface-2)}
.v.good{color:var(--loss)} .v.bad{color:var(--gain)}

.bar{height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:12px}
.bar i{display:block; height:100%; border-radius:99px; background:var(--blue)}
.barwrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px}
.barwrap .lbl{display:flex; justify-content:space-between; font-family:var(--f-disp); font-weight:600; font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.barwrap .lbl b{color:var(--ink); font-weight:600}

/* ============================================================
   TABLES
   ============================================================ */
.tablewrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
thead th{
  background:var(--band); color:var(--band-ink);
  font-family:var(--f-disp); font-weight:600; font-size:10.5px;
  letter-spacing:.13em; text-transform:uppercase;
  padding:12px; text-align:right; white-space:nowrap;
}
thead th:first-child{text-align:center}
thead th.l{text-align:left}
tbody td{padding:9px 12px; text-align:right; border-bottom:1px solid var(--line-2); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.day{
  text-align:center; width:48px; color:var(--muted);
  font-family:var(--f-mono); font-size:12px;
}
td.date{text-align:left; font-family:var(--f-body); font-weight:500; font-size:14px; letter-spacing:-0.005em; color:var(--ink)}
td.goal{color:var(--muted)}
td.wt{font-family:var(--f-mono); font-weight:600; font-size:14.5px; color:var(--ink)}
td.est{color:var(--muted); font-weight:500}
tr.mon td{background:var(--mon)}
tr.mon td:first-child{box-shadow:inset 3px 0 0 var(--mon-line)}
tr.wknd td{background:var(--wknd)}
tr.now td{background:var(--now)}
tr.now td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
tr.now td.wt{font-weight:600}
tr.future td{color:var(--muted)}
tr.future td.date{color:var(--muted)}
.up{color:var(--gain)} .down{color:var(--loss)}

.subtabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px}
.subtabs button{
  font-family:var(--f-disp); font-weight:600; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  padding:9px 16px; border-radius:99px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--muted);
}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{background:var(--band); border-color:var(--band); color:var(--band-ink)}

.copybtn{
  display:inline-flex; align-items:center; gap:9px;
  font-family:var(--f-disp); font-weight:600; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  padding:11px 18px; border-radius:9px; cursor:pointer; margin-top:14px; margin-right:8px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
}
.copybtn:hover{border-color:var(--blue); color:var(--ink)}
.copybtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Chart */
.chartcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 16px 12px}
svg.chart{display:block; width:100%; height:auto}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .axis{fill:var(--muted); font-family:var(--f-mono); font-size:11px}
.chart .pace{stroke:var(--muted); stroke-width:1.6; stroke-dasharray:5 5; fill:none}
.chart .real{stroke:var(--blue); stroke-width:2.6; fill:none; stroke-linejoin:round}
.chart .pt{fill:var(--blue)}
.chart .band{fill:var(--mint); opacity:.11}
.legend{display:flex; gap:22px; flex-wrap:wrap; padding:14px 6px 4px}
.legend span{font-family:var(--f-disp); font-weight:600; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

.gap{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--signal);
  border-radius:var(--r); padding:15px 18px; margin-top:16px;
  font-size:14px; color:var(--ink-2);
}
.gap b{font-family:var(--f-disp); font-weight:600; letter-spacing:.13em; text-transform:uppercase; font-size:10.5px; color:var(--muted); display:block; margin-bottom:6px}

.scrim{display:none}
@media (max-width:860px){
  main{padding:20px 14px 90px}
  nav.side{
    position:fixed; top:58px; left:0; z-index:35;
    transform:translateX(-100%); transition:transform .2s ease;
    box-shadow:var(--shadow);
  }
  body.nav-open nav.side{transform:none}
  body.nav-collapsed nav.side{flex-basis:var(--nav-w); width:var(--nav-w)}
  body.nav-collapsed nav.side .nav-label,
  body.nav-collapsed nav.side .nav-group{opacity:1; pointer-events:auto}
  body.nav-open .scrim{display:block; position:fixed; inset:58px 0 0; background:rgba(0,0,0,.35); z-index:30}
  .here{display:none}
  .today-chip .chip-lbl{display:none}
  .row{padding:13px 15px} .row .v{font-size:21px}
  .track-ends b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="navToggle" aria-label="Toggle navigation">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <span class="brand">Finish Line</span>
  <span class="here" id="here"></span>
  <span class="spacer"></span>
  <span class="today-chip" id="todayChip"></span>
  <button class="iconbtn" id="themeToggle" aria-label="Switch light or dark">
    <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
  </button>
</header>

<div class="layout">
  <nav class="side" id="side"></nav>
  <div class="scrim" id="scrim"></div>
  <main>
    <section class="page" id="p-dashboard"></section>
    <section class="page" id="p-week"></section>
    <section class="page" id="p-total"></section>
    <section class="page" id="p-log"></section>
    <section class="page" id="p-body"></section>
    <section class="page" id="p-weeks"></section>
    <section class="page" id="p-trend"></section>
  </main>
</div>

<script>
/* ============================================================================
   1. ADD NEW RENPHO DAYS HERE — one line per scan, oldest first.
      Order:  date (YYYY-MM-DD), weight, BMI, body fat %, visceral,
              subcutaneous %, BMR, metabolic age, note (optional)
      Use null for anything the scan didn't give you.
      Last item is an optional flag:
        "carried"  = no weigh-in at all, numbers carried from a nearby day
        "est-comp" = weight is real, body comp borrowed from the closest-weight day
      Either flag greys the borrowed figures out on screen.
   ========================================================================= */
const READINGS = [
  ["2026-07-26", 211.6, null, null, null, null, null, null],
  ["2026-07-27", 214.8, 30.8, 27.9, 13, 24.0, 1885, 44],
  ["2026-07-28", 213.0, 30.5, 27.5, 13, 23.7, 1872, 44],
  ["2026-07-29", 212.0, 30.4, 27.3, 13, 23.5, 1868, 44],
  ["2026-07-30", 211.0, 30.2, 27.0, 13, 23.3, 1855, 44],
  ["2026-07-31", 210.4, 30.1, 26.9, 13, 23.2, 1894, 44],
  ["2026-08-01", 213.2, 30.5, 27.6, 13, 23.8, 1877, 44],
  ["2026-08-02", 213.2, 30.5, 27.6, 13, 23.8, 1877, 44, "carried"],
  ["2026-08-03", 215.2, 30.8, 28.0, 13, 24.1, 1885, 44],
  ["2026-08-04", 212.4, 30.4, 27.4, 13, 23.6, 1868, 44],
  ["2026-08-05", 212.4, 30.4, 27.3, 13, 23.5, 1868, 44],
  ["2026-08-06", 208.6, 29.9, 26.5, 13, 22.8, 1881, 43],
  ["2026-08-07", 210.4, 30.1, 26.9, 13, 23.2, 1894, 44],
  ["2026-08-08", 212.6, 30.4, 27.4, 13, 23.6, 1868, 44],
  ["2026-08-09", 211.0, 30.2, 27.1, 13, 23.3, 1859, 44],
  ["2026-08-10", 212.8, 30.5, 27.5, 13, 23.7, 1872, 44],
  ["2026-08-11", 211.8, 30.3, 27.2, 13, 23.4, 1864, 44],
  ["2026-08-12", 211.0, 30.2, 27.1, 13, 23.3, 1859, 44, "carried"],
  ["2026-08-13", 209.8, 30.0, 26.8, 13, 23.1, 1889, 44],
  ["2026-08-14", 212.0, 30.3, 27.3, 13, 23.5, 1864, 44],
  ["2026-08-15", 209.8, 30.0, 26.8, 13, 23.1, 1894, 44],
  ["2026-08-16", 212.8, 30.5, 27.5, 13, 23.7, 1872, 44, "est-comp"]
];

/* ============================================================================
   2. THE PLAN — change these if the program resets again.
   ========================================================================= */
const CONFIG = {
  programStart : "2026-08-03",   // day the current plan started
  targetDate   : "2026-09-30",   // finish line
  goalWeight   : 199.8,          // weight you're aiming at
  paceLbsPerWeek: 2.0,           // the goal line slope
  startWeight  : null,           // null = use the weight logged on programStart
  targets: { bmi:29.9, bf:25.0, visceral:11, subq:16.7, metAge:39 }
};

/* ===================== helpers ===================== */
const DAY = 86400000;
const d = s => { const [y,m,dd] = s.split("-").map(Number); return new Date(y, m-1, dd); };
const iso = x => `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
const between = (a,b) => Math.round((d(b) - d(a)) / DAY);
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const label = s => { const x = d(s); return `${DOW[x.getDay()]} ${MON[x.getMonth()]} ${x.getDate()}`; };
const short = s => { const x = d(s); return `${MON[x.getMonth()]} ${x.getDate()}`; };
const f1 = n => (n===null||n===undefined||isNaN(n)) ? "—" : n.toFixed(1);
const sgn = n => (n>0?"+":n<0?"\u2212":"") + Math.abs(n).toFixed(1);
const cls = n => n>0 ? "up" : n<0 ? "down" : "";

const BY = {};
READINGS.forEach(r => BY[r[0]] = {
  date:r[0], weight:r[1], bmi:r[2], bf:r[3], visceral:r[4],
  subq:r[5], bmr:r[6], metAge:r[7], note:r[8]||null
});
const logged = READINGS.map(r => r[0]);
const latest = BY[logged[logged.length-1]];
const START_W = CONFIG.startWeight ?? (BY[CONFIG.programStart]?.weight ?? READINGS[0][1]);

// the goal line: START_W on programStart, sloping down paceLbsPerWeek
const perDay = CONFIG.paceLbsPerWeek / 7;
function goalOn(date){
  const n = between(CONFIG.programStart, date);
  if (n < 0) return null;
  return START_W - n * perDay;
}

// every calendar day from the first reading through the target date
const ALL = (() => {
  const out = []; let c = d(READINGS[0][0]); const end = d(CONFIG.targetDate);
  while (c <= end){ out.push(iso(c)); c = new Date(c.getTime() + DAY); }
  return out;
})();

const daysSoFar = between(CONFIG.programStart, latest.date);
const daysLeft  = between(latest.date, CONFIG.targetDate);
const lost      = START_W - latest.weight;
const toGo      = latest.weight - CONFIG.goalWeight;
const totalGoal = START_W - CONFIG.goalWeight;
const vsPace    = latest.weight - goalOn(latest.date);

// Monday that starts the week containing a date
function mondayOf(date){
  const x = d(date); const back = (x.getDay() + 6) % 7;
  return iso(new Date(x.getTime() - back*DAY));
}
const mondays = ALL.filter(s => d(s).getDay() === 1);

/* ===================== nav ===================== */
const PAGES = [
  { id:"dashboard", name:"Dashboard", group:"Where I stand",
    icon:'<path d="M4 19V5M4 19h16"/><path d="M8 15l4-5 4 3 4-6"/>' },
  { id:"week", name:"This week", group:null,
    icon:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/>' },
  { id:"total", name:"Whole program", group:null,
    icon:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>' },
  { id:"log", name:"Daily log", group:"The numbers",
    icon:'<path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/>' },
  { id:"body", name:"Body composition", group:null,
    icon:'<circle cx="12" cy="5.5" r="2.5"/><path d="M8 21v-5l-2-3 2-3h8l2 3-2 3v5"/>' },

/* ===================== chart (shared by This week and Trend) ===================== */
function chartSVG(dates, opt){
  opt = opt || {};
  const W = 860, H = opt.h || 340, P = { t:18, r:16, b:34, l:46 };
  const n = dates.length - 1;
  const idx = {}; dates.forEach((s,i) => idx[s] = i);
  const pts   = dates.filter(s => BY[s]).map(s => ({ x: idx[s], y: BY[s].weight, date:s }));
  const goals = dates.map((s,i) => ({ x:i, y: goalOn(s) })).filter(p => p.y !== null);
  if (!pts.length) return "";

  let vals = pts.map(p=>p.y).concat(goals.map(p=>p.y));
  if (opt.finish) vals.push(CONFIG.goalWeight);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min;
  const step = span <= 3 ? 0.5 : span <= 8 ? 1 : 2;
  let lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  if (min - lo < step*0.2) lo -= step;          // keep the line off the axis
  if (hi - max < step*0.2) hi += step;
  if (hi === lo) hi = lo + step;

  const X = i => P.l + (n ? i/n : 0.5) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - lo)/(hi - lo)) * (H - P.t - P.b);
  const path = a => a.map((p,i) => (i?"L":"M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const tick = v => v % 1 ? v.toFixed(1) : String(v);

  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(Number(v.toFixed(2)));
  const xl = opt.xLabels ? opt.xLabels(dates) : [];

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opt.alt||"Weight against the goal line"}">
    ${ticks.map(v => `<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/>
      <text class="axis" x="${P.l-9}" y="${Y(v)+4}" text-anchor="end">${tick(v)}</text>`).join("")}
    ${opt.finish ? `<rect class="band" x="${P.l}" y="${Y(hi)}" width="${W-P.l-P.r}" height="${Y(CONFIG.goalWeight)-Y(hi)}"/>
      <line x1="${P.l}" x2="${W-P.r}" y1="${Y(CONFIG.goalWeight)}" y2="${Y(CONFIG.goalWeight)}" stroke="var(--mint)" stroke-width="2"/>` : ""}
    ${xl.map(o => `<text class="axis" x="${X(o.i)}" y="${H-12}" text-anchor="middle">${o.text}</text>`).join("")}
    <path class="pace" d="${path(goals)}"/>
    <path class="real" d="${path(pts)}"/>
    ${pts.map(p => `<circle class="pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${opt.dot||2.9}"/>`).join("")}
  </svg>`;
}

    ${chartSVG(ALL, { h:340, finish:true,
      xLabels: ds => ds.map((s,i) => ({s,i})).filter(o => o.s.endsWith("-01") || o.i === 0)
                       .map(o => ({ i:o.i, text: MON[Number(o.s.slice(5,7))-1] })) })}
    <div class="legend">
      <span><span class="dot" style="background:var(--blue)"></span>Actual weight</span>
      <span><span class="dot" style="background:var(--muted)"></span>Goal line, ${f1(CONFIG.paceLbsPerWeek)} lb a week</span>
      <span><span class="dot" style="background:var(--mint)"></span>Finish at ${f1(CONFIG.goalWeight)} lb</span>
    </div>
  </div>
  ${rows(
    row("Highest logged", f1(hiW), {unit:"lb"}) +
    row("Lowest logged", f1(loW), {unit:"lb"}) +
    row("Spread", f1(hiW - loW), {unit:"lb"}) +
    row("Days logged", pts.length, {sub:`${logged.filter(s=>BY[s].bmi!==null).length} with a full scan`})
  )}`;
})();

route();
</script>
</body>
</html>
